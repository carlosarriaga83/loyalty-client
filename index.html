<!doctype html>
<html lang="es" class="preload">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <title>Club de Lealtad & Recompensas</title>
    <meta name="description" content="Portal de clientes y club de lealtad con recompensas y pases digitales." />
    <meta property="og:title" content="Club de Lealtad & Recompensas" />
    <meta property="og:description" content="Portal de clientes y club de lealtad con recompensas y pases digitales." />
    <style id="fouc-prevention">
      /* Evita que los elementos animen el cambio de color durante la carga inicial */
      .preload, .preload * {
        -webkit-transition: none !important;
        -moz-transition: none !important;
        -ms-transition: none !important;
        -o-transition: none !important;
        transition: none !important;
      }
    </style>
    <script>
      (function() {
        try {
          var hostname = window.location.hostname.toLowerCase();
          var params = new URLSearchParams(window.location.search);
          var storeParam = (params.get('store') || params.get('slug') || '').toLowerCase();
          var cachedId = localStorage.getItem('client_selected_store_id');
          
          var themesMap = {};
          try {
            themesMap = JSON.parse(localStorage.getItem('client_store_themes') || '{}');
          } catch(e) {}

          var theme = null;
          if (storeParam && themesMap[storeParam]) {
            theme = themesMap[storeParam];
          } else if (themesMap[hostname]) {
            theme = themesMap[hostname];
          } else if (cachedId && themesMap[cachedId.toLowerCase()]) {
            theme = themesMap[cachedId.toLowerCase()];
          } else {
            var rawCached = localStorage.getItem('client_cached_theme');
            if (rawCached) theme = JSON.parse(rawCached);
          }

          if (theme) {
            if (theme.primary_color) {
              var hex = theme.primary_color;
              document.documentElement.style.setProperty('--brand-gold', hex);
              document.documentElement.style.setProperty('--brand-gold-hover', hex);
              document.documentElement.style.setProperty('--brand-gold-border', hex + '40');
              document.documentElement.style.setProperty('--brand-gold-light', hex + '1A');
            }
            if (theme.secondary_color) {
              var sec = (theme.secondary_color || '').trim().toLowerCase();
              if (sec && sec !== '#ffffff' && sec !== '#fff' && sec !== 'white' && sec !== 'rgb(255,255,255)') {
                document.documentElement.style.setProperty('--brand-action', theme.secondary_color);
              }
            }
            if (theme.name) {
              document.title = theme.name + ' - Club de Lealtad';
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
